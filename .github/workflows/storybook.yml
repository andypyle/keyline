name: Storybook

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # Secrets aren't available to pull requests from forks, so skip those.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build --filter=docs

      - name: Deploy to production
        if: github.ref == 'refs/heads/main'
        run: pnpm --filter docs exec wrangler deploy

      - name: Upload preview
        if: github.event_name == 'pull_request'
        run: pnpm --filter docs exec wrangler versions upload --preview-alias pr-${{ github.event.pull_request.number }}
